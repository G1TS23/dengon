# ---------------------------------------------------------------------------
# Workspace Rust dengon — voir docs/synthese/04-architecture.md §5
#
# Sept crates :
#   dengon-core    lib      LE protocole (protocol, crypto, identity, store,
#                           sync, ledger, observability, api)
#   dengon-ble     lib      trait Transport + implémentation btleplug (desktop)
#   dengon-node    bin      nœud CLI headless
#   dengon-sim     lib+bin  simulateur multi-nœuds, scénarios .ron
#   dengon-verify  bin      vérification de journal chaîné (appelé par le
#                           dashboard Python en sous-processus)
#   dengon-ffi     lib      bindings UniFFI vers Kotlin (cdylib)
#   dengon-conformance      vecteurs de contracts/packet/ rejoués contre un
#                  lib      dengon-core SANS std — la patte « firmware » du
#                           job cross-vectors (US-222). Aucun code : c'est sa
#                           table de dépendances qui est le test.
#
# US-104 ne livre que les squelettes : chaque crate compile, expose une
# constante et un test fumigène. Les implémentations réelles arrivent au
# sprint 2 (voir docs/plan-mvp.md).
# ---------------------------------------------------------------------------

[workspace]
members  = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
# Choix transverse figé par docs/synthese/04-architecture.md §7.
edition = "2021"
# MSRV : PLANCHER de version acceptée, à ne pas confondre avec la version
# exacte figée dans rust-toolchain.toml (qui est, elle, ce que la CI installe).
# 1.85 est très au-dessus du minimum réel (les lints de workspace demandent
# 1.74) : c'est un plancher confortable, pas une contrainte étudiée. Aucun job
# CI ne le vérifie encore — voir docs/suivi/03-ecarts-conception.md.
rust-version = "1.85"
repository   = "https://github.com/G1TS23/dengon"
authors      = ["G1TS23"]
# Licence pas encore tranchée par l'équipe (docs/synthese/01-sujets-a-trancher.md).
# publish = false rend le champ `license` non bloquant en attendant.
publish = false

# ---------------------------------------------------------------------------
# Dépendances partagées : chaque crate écrit `foo = { workspace = true }`.
#
# Volontairement limité aux crates INTERNES. Une dépendance externe déclarée
# ici avec un numéro de version erroné fait échouer tout le workspace, y
# compris `cargo fmt`. On ajoute une ligne au moment où une PR l'utilise
# réellement (US-105 pour btleplug, US-106 pour uniffi, US-108 pour la crypto).
# ---------------------------------------------------------------------------
[workspace.dependencies]
dengon-core = { path = "crates/dengon-core", version = "0.1.0" }
dengon-ble  = { path = "crates/dengon-ble", version = "0.1.0" }
# `store` (US-207) uniquement — ni l'un ni l'autre n'a besoin de no_std :
# rusqlite ne compile pas sur cible ESP32 de toute façon (docs/synthese/04
# §2, "store est derrière un trait Store" — l'impl NVS/flash de l'ESP32 est
# un module séparé, pas celui-ci). "bundled" : sqlite3 vendorisé, pas de
# dépendance système (même choix que faute de mieux sur les postes de dev
# et la CI, qui n'ont pas forcément libsqlite3-dev).
rusqlite = { version = "0.32", features = ["bundled"] }
# XChaCha20-Poly1305 : `store` (US-207) et le coffre d'`identity` (US-205).
# `default-features = false` + `alloc` : compilable en no_std pour le coffre,
# dont le nonce vient de la RNG injectée par l'appelant. `store` a besoin
# d'`aead::OsRng` (nonce aléatoire à chaque chiffrement, jamais deux fois le
# même avec la même clé) : dengon-core active `getrandom` via SA feature
# `std`, pas ici, pour ne pas tirer getrandom sur ESP32.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
# no_std (`default-features = false` retire l'implémentation std du digest,
# indispensable pour compiler `ledger` (US-206) sur cible ESP32).
sha2 = { version = "0.10", default-features = false }

# Version EXACTE (pas de caret) : même logique que rust-toolchain.toml — une
# montée de version d'UniFFI est une PR volontaire, pas un `cargo update`
# silencieux. default-features = false retire "cargo-metadata" (inutile ici,
# on n'invoque jamais `uniffi-bindgen` en CLI) ; dengon-ffi ajoute la feature
# "build" seulement sur sa dépendance de build.
uniffi = { version = "=0.28.3", default-features = false }
# no_std : configuration exacte validée par le Spike A (US-101), qui compile
# pour xtensa-esp32-none-elf. On n'active PAS `rand_core` : la génération de
# clé (RNG) est fournie par l'appelant (firmware : esp_fill_random, US-307).
ed25519-dalek = { version = "2.2", default-features = false, features = ["zeroize"] }
# Noise XX / X (US-204). ÉPINGLÉ ≥ 0.10.0 : la 0.9.6 dépend de `getrandom` 0.2
# en dur, sans backend pour xtensa (docs/synthese/06-securite.md §3, Spike A
# point 1). Features = configuration exacte du Spike A ; PAS `use-getrandom` :
# l'aléa du handshake est injecté par l'appelant (crypto::noise, `rand_core`).
snow = { version = ">=0.10.0, <0.11", default-features = false, features = ["default-resolver", "use-curve25519", "use-chacha20poly1305", "use-sha2"] }
# Clé publique X25519 de `StaticKeypair` (retour de revue #81) : c'est la
# crate que `snow` utilise déjà, la version suit la sienne. Sans features par
# défaut : ni `alloc`, ni tables précalculées (no_std, ESP32).
curve25519-dalek = { version = "4.1", default-features = false }
# recipient_tag = HMAC-SHA256(...)[0..16] (US-204).
hmac      = { version = "0.12", default-features = false }
rand_core = { version = "0.6", default-features = false }
zeroize   = { version = "1", default-features = false, features = ["alloc"] }
# QR de contact (base64url) et affichage du peerID (base32), no_std + alloc.
data-encoding = { version = "2", default-features = false, features = ["alloc"] }
# Tests uniquement : RNG déterministe (vecteurs de conformité) et property tests.
rand_chacha = { version = "0.3", default-features = false }
proptest    = "1"
serde_json  = "1"

# ---------------------------------------------------------------------------
# Lints centralisés (Cargo >= 1.74). C'est la « configuration clippy
# versionnée » exigée par l'US-104 : clippy.toml ne peut PAS activer un lint,
# il ne fait que configurer ceux activés ici.
#
# ⚠ PIÈGE SILENCIEUX : ces lints n'ont AUCUN effet sur une crate qui n'écrit
# pas `[lints] workspace = true` dans son propre Cargo.toml. Aucune erreur
# n'est émise — la crate est juste ignorée. Vérifier les six.
#
# Avantage sur `-D warnings` en CI seul : ces lints s'appliquent aussi au
# `cargo clippy` local, donc le développeur voit le problème avant de pousser.
#
# On n'utilise JAMAIS "forbid" : forbid est inviolable, et dengon-ffi devra
# neutraliser `unsafe_code` (UniFFI génère de l'unsafe).
# ---------------------------------------------------------------------------
[workspace.lints.rust]
unsafe_code                   = "deny"
missing_debug_implementations = "warn"
unused_qualifications         = "warn"
# priority = -1 : sans lui, un lint individuel du même groupe ne peut pas
# surcharger le groupe et Cargo refuse la configuration.
rust_2018_idioms = { level = "warn", priority = -1 }
# missing_docs = "warn"   # à activer sur dengon-core quand l'API se stabilise

[workspace.lints.clippy]
all           = { level = "warn", priority = -1 }
unwrap_used   = "warn"
expect_used   = "warn"
todo          = "warn"
unimplemented = "warn"
dbg_macro     = "warn"
mem_forget    = "warn"
# Pertinents pour un codec binaire (TTL, longueurs, offsets). Activés avec
# `protocol` (US-108, retour de revue #63, point de Paul : ce commentaire
# annonçait l'activation à cette US précise, restée commentée dans la PR).
cast_possible_truncation = "warn"
cast_sign_loss           = "warn"
cast_possible_wrap       = "warn"

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"
