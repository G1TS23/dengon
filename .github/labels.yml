- name: "skill:c-embarqué"
  color: "555555"
  description: "C / ESP-IDF / FreeRTOS"
- name: "skill:python"
  color: "3572A5"
  description: "Python / FastAPI"
- name: "skill:web"
  color: "E34C26"
  description: "HTML / CSS / JS"
- name: "skill:rédaction"
  color: "8E44AD"
  description: "Rédaction, spec, support"

# --- needs: --------------------------------------------------------------
# Contraintes DURES (§10.2). Elles ne disent pas « c'est difficile », elles
# disent « untel ne peut PHYSIQUEMENT pas prendre cette US ».
- name: "needs:materiel-esp32"
