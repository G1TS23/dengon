name: dashboard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nécessaire au filtre de chemins sur les événements push.
          fetch-depth: 0

      # Filtrage DANS le job, pas via `on.pull_request.paths` : un filtre au
      # niveau du déclencheur empêche GitHub de créer un check run du tout
      # pour une PR qui ne touche pas dashboard/**, qui resterait bloquée sur
      # « En attente » si ce check devient requis (même piège que core.yml,
      # voir docs/suivi/03-ecarts-conception.md — retour de revue #59, round 2).
      - name: Détecter les changements dashboard/api
        id: filtre
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            api:
              - 'dashboard/**'
              - '.github/workflows/dashboard.yml'
              - '.uv-version'
              # `tests/test_integrity.py` (US-310) construit et appelle le
              # VRAI binaire `dengon-verify` : un changement dans son code ou
              # dans `dengon-core` (dont il dépend entièrement, pas juste
              # `ledger.rs`) peut faire passer ou casser ces tests sans
              # qu'aucun fichier sous `dashboard/` ne bouge.
              - 'crates/dengon-verify/**'
              - 'crates/dengon-core/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'

      - name: Aucun changement dashboard/api
        if: steps.filtre.outputs.api != 'true'
        run: |
          {
            echo '### api — ignoré'
            echo
            echo "Aucun fichier dashboard/api modifié : les étapes uv sont sautées."
            echo "Le check est tout de même rapporté, pour ne pas bloquer la PR."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Lire la version de uv (source unique, voir dashboard/api/Dockerfile)
        if: steps.filtre.outputs.api == 'true'
        id: uv-version
        working-directory: .
        run: echo "version=$(cat .uv-version)" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: steps.filtre.outputs.api == 'true'
        with:
          version: ${{ steps.uv-version.outputs.version }}
          enable-cache: true
      - name: Installer depuis le lock (échoue si uv.lock est périmé)
        if: steps.filtre.outputs.api == 'true'
        # --no-build : wheels seulement, aucun script de build de dépendance.
        # --no-install-project : les tests importent `app` depuis les sources
        # (voir tests/conftest.py), inutile de construire le paquet local.
        run: uv sync --frozen --extra dev --no-install-project --no-build
      - name: Lint (ruff)
        if: steps.filtre.outputs.api == 'true'
        run: uv run --no-sync --no-build ruff check .

      # `tests/test_integrity.py` (US-310) appelle le VRAI binaire
      # `dengon-verify` en sous-processus — même principe que le reste de la
      # CI (core.yml) : la règle de vérification reste celle de
      # `dengon_core::ledger`, jamais réécrite côté test Python. Toolchain
      # lue depuis `rust-toolchain.toml` (source unique, même étape que
      # core.yml) plutôt que dupliquée ici.
      - name: Lire la toolchain figée
        if: steps.filtre.outputs.api == 'true'
        id: toolchain
        working-directory: .
        run: |
          canal=$(grep -oP '(?<=^channel\s=\s")[^"]+' rust-toolchain.toml)
          if [ -z "$canal" ]; then
            echo "Impossible de lire 'channel' dans rust-toolchain.toml" >&2
            exit 1
          fi
          echo "canal=$canal" >> "$GITHUB_OUTPUT"

      - name: Installer Rust
        if: steps.filtre.outputs.api == 'true'
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master au 2026-09-03
        with:
          toolchain: ${{ steps.toolchain.outputs.canal }}

      - name: Cache cargo
        if: steps.filtre.outputs.api == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: dengon-verify
          workspaces: . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Construire dengon-verify
        if: steps.filtre.outputs.api == 'true'
        working-directory: .
        run: cargo build -p dengon-verify --locked

      - name: Tests (pytest)
        if: steps.filtre.outputs.api == 'true'
        env:
          DENGON_VERIFY_BIN: ${{ github.workspace }}/target/debug/dengon-verify
        run: uv run --no-sync --no-build pytest
      - name: Le paquet s'installe (packages = ["app"] à jour dans pyproject.toml)
        if: steps.filtre.outputs.api == 'true'
        # Les tests importent `app` via sys.path (tests/conftest.py), pas via
        # une installation du paquet — donc `packages = ["app"]` dans
        # pyproject.toml n'est vérifié par rien d'autre : un sous-paquet
        # ajouté sous app/ sans mise à jour de cette liste romprait
        # l'installation réelle sans que le reste de la CI le voie (retour de
        # revue #59, round 4, point d'OswinFreyr). Construit le wheel et
        # vérifie qu'il contient bien les modules réels, indépendamment du
        # raccourci sys.path des tests.
        #
        # La liste des modules attendus est DÉRIVÉE de `git ls-files`, pas
        # codée en dur : une liste figée ne détecte rien de plus qu'elle-même
        # — un sous-paquet ajouté sous `app/` (ex. `app/routes/`) resterait
        # absent des deux listes à la fois, et cette étape resterait verte à
        # tort (retour de revue #59, round 5, point 1 d'OswinFreyr : le
        # backend est `setuptools` avec `packages = ["app"]`, non récursif —
        # exactement le cas que cette étape est censée détecter).
        run: |
          uv build --wheel -o /tmp/dashboard-api-dist
          statut=0
          n_modules=0
          # `*` traverse déjà les `/` dans un pathspec git : `app/*.py` suffit,
          # `app/**/*.py` était redondant (retour de revue #59, round 6,
          # point 4 d'OswinFreyr).
          while IFS= read -r module; do
            n_modules=$((n_modules + 1))
            python3 -m zipfile -l /tmp/dashboard-api-dist/*.whl | grep -q "$module" || {
              echo "::error::$module absent du wheel construit — packages/pyproject.toml périmé"
              statut=1
            }
          done < <(git ls-files 'app/*.py')
          # Si git ls-files ne renvoie RIEN (répertoire de travail changé,
          # motif mal écrit...), la boucle ne s'exécute jamais et $statut
          # reste à 0 : l'étape passerait verte sans avoir rien vérifié
          # (retour de revue #59, round 6, point 4 d'OswinFreyr).
          if [ "$n_modules" -eq 0 ]; then
            echo "::error::aucun module app/*.py trouvé par git ls-files — vérification non exécutée"
            statut=1
          fi
          exit "$statut"
