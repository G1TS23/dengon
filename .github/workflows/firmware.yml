# ---------------------------------------------------------------------------
# Workflow `firmware` — compilation du relais ESP32 (firmware/dengon-relay)
# ET cross-compilation de `libdengon_core.a` (crate `dengon-core-embed`,
# US-307) pour `xtensa-esp32-none-elf`, LIÉE au firmware depuis l'US-308 —
# voir la section 0, qui précède donc le build ESP-IDF.
# Référence : US-114 / US-307 / US-308, docs/synthese/08-relais-esp32.md §3.
#
# Le build ESP-IDF passe par l'image Docker officielle `espressif/idf`,
# ÉPINGLÉE PAR DIGEST — exactement la même commande qu'en local (voir
# docs/suivi/modules/firmware-relay.md). Aucun ESP-IDF n'est installé sur le
# runner : la chaîne de compilation embarquée pèse ~2 Go d'outils, et sa
# reproductibilité vaut mieux qu'une installation script par script. La
# cross-compilation Rust xtensa, elle, installe sa toolchain (`espup`)
# directement sur le runner : Spike A (US-101) a validé cette voie, pas de
# précédent Docker équivalent côté Rust dans ce dépôt.
#
# Pourquoi `docker run` plutôt que `container:` au niveau du job : le checkout
# et dorny/paths-filter tournent alors nativement (Node du runner), et surtout
# la ligne de commande reste copiable telle quelle par un humain. Le digest joue
# le même rôle qu'un SHA de commit pour une action tierce — un tag est mutable.
#
# ⚠ DEUX RÈGLES À NE PAS CASSER (identiques à core.yml)
#
# 1. Le filtrage par chemin est fait DANS le job, jamais via
#    `on.pull_request.paths`. Avec un filtre au niveau du déclencheur, GitHub ne
#    démarre pas du tout le workflow sur une PR qui ne touche pas firmware/ :
#    aucun check n'est créé, et la PR resterait bloquée sur « Expected —
#    Waiting for status to be reported » le jour où `firmware` entrera dans les
#    checks requis de `main`. Or la plupart des PR de ce projet ne touchent que
#    docs/.
#
# 2. Les actions tierces sont épinglées sur un SHA de commit complet, avec le
#    numéro de version en commentaire à droite. Pour mettre à jour : relire le
#    diff de l'action, puis changer SHA et commentaire ensemble.
#
# `firmware` n'est PAS encore un check requis de `main` (la liste est
# core / sim / audit / cross-vectors). Pour l'y ajouter après le merge, répéter
# la liste COMPLÈTE : l'API PATCH remplace le tableau `contexts`, elle ne
# l'enrichit pas.
# ---------------------------------------------------------------------------
name: firmware

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  # On n'annule jamais un run sur main : il fait foi pour l'historique.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Une seule source de vérité pour l'image, partagée avec la fiche de suivi.
  # Rafraîchir le digest :
  #   docker buildx imagetools inspect espressif/idf:v5.5.5 --format '{{.Manifest.Digest}}'
  # ⚠ Prendre le digest de l'INDEX (ce que renvoie la commande ci-dessus), pas
  #   celui d'un manifeste de plateforme : `docker manifest inspect --verbose`
  #   affiche d'abord l'entrée linux/amd64, et l'épingler casserait sur arm64.
  IDF_IMAGE: espressif/idf:v5.5.5@sha256:a9231d0697ab8f7517cc072e93b7c83e04907bfbfba80b6440d7dbbf90665cf2

jobs:
  firmware:
    name: firmware
    runs-on: ubuntu-latest
    # 45 : l'installation d'espup + de la toolchain `esp` (~2 Go, ~7 min,
    # Spike A §3) s'ajoute aux builds ESP-IDF depuis que le firmware lie
    # libdengon_core.a (US-308).
    timeout-minutes: 45
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nécessaire au filtre de chemins sur les événements push, et à
          # `git describe`, dont idf.py tire PROJECT_VER.
          fetch-depth: 0

      - name: Détecter les changements firmware
        id: filtre
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            # Depuis l'US-308 le firmware LIE libdengon_core.a : un changement
            # de dengon-core (ou de sa façade C) change le binaire flashé, il
            # relance donc tout le job — l'ancien filtre séparé `core_ffi`
            # (US-307) n'a plus lieu d'être.
            firmware:
              - 'firmware/**'
              - 'crates/dengon-core/**'
              - 'crates/dengon-core-ffi/**'
              - 'crates/dengon-core-embed/**'
              - '.github/workflows/firmware.yml'

      - name: Aucun changement firmware
        if: steps.filtre.outputs.firmware != 'true'
        run: |
          {
            echo '### firmware — ignoré'
            echo
            echo "Aucun fichier de firmware/ modifié : le build ESP-IDF est sauté."
            echo "Le check est tout de même rapporté, pour ne pas bloquer la PR."
          } >> "$GITHUB_STEP_SUMMARY"

      # --- 0. `libdengon_core.a` pour xtensa (US-307, lié depuis US-308) ----
      # AVANT `idf.py build` : components/dengon_core_ffi lit l'archive en
      # place (crates/dengon-core-embed/target/…) et échoue au configure si
      # elle manque. Compilée sur le runner (pas dans le conteneur ESP-IDF),
      # qui la voit par le montage du dépôt entier.
      #
      # `espup` (~2 Go, Spike A §3, `docs/suivi/spikes/US-101-*.md`) installe
      # la toolchain nightly forkée `esp`, seule à connaître la cible
      # `xtensa-esp32-none-elf` (tier 3, sans std précompilée). `dengon-core-
      # embed` est une racine de workspace séparée du reste (voir son
      # Cargo.toml) : son propre `Cargo.lock`, sa propre toolchain déclarée
      # par son `rust-toolchain.toml` (nightly amont, PAS `esp` — trop lourd
      # pour la vérification hôte du job `cross-vectors`) — d'où `cargo +esp`
      # explicite ci-dessous, qui l'emporte sur ce fichier pour cette seule
      # invocation.
      #
      - name: Installer espup (toolchain xtensa)
        if: steps.filtre.outputs.firmware == 'true'
        run: |
          cargo install espup --locked
          espup install --targets esp32
          # Pas de `rustup component add --toolchain esp` : rustup ≥ 1.28
          # rejette ce nom de toolchain custom (« invalid toolchain name »),
          # et espup installe déjà `rust-src` — on se contente de le vérifier.
          test -d "$(rustc +esp --print sysroot)/lib/rustlib/src/rust"
          cargo +esp --version

      - name: Compiler libdengon_core.a pour xtensa-esp32-none-elf
        if: steps.filtre.outputs.firmware == 'true'
        working-directory: crates/dengon-core-embed
        run: |
          cargo +esp build --release --target xtensa-esp32-none-elf --locked
          ls -la target/xtensa-esp32-none-elf/release/libdengon_core.a

      - name: Publier libdengon_core.a (xtensa)
        if: steps.filtre.outputs.firmware == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libdengon_core-xtensa
          path: |
            crates/dengon-core-embed/target/xtensa-esp32-none-elf/release/libdengon_core.a
            crates/dengon-core-ffi/include/dengon_core.h
          retention-days: 14
          if-no-files-found: error

      # --- 1. Compilation ---------------------------------------------------
      # -u $(id -u):$(id -g) : sans cela, build/ appartient à root et les étapes
      #   suivantes ne peuvent plus le lire. En local, c'est aussi ce qui évite
      #   un arbre de travail impossible à nettoyer sans sudo.
      # -e HOME=/tmp : l'uid injecté n'existe pas dans le /etc/passwd de
      #   l'image, donc il n'a pas de home ; le gestionnaire de composants IDF
      #   en exige un.
      # On monte le dépôt ENTIER, pas seulement firmware/ : idf.py lit .git pour
      # PROJECT_VER, et l'US-307 aura besoin de crates/.
      - name: Compiler (idf.py build)
        if: steps.filtre.outputs.firmware == 'true'
        run: |
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${GITHUB_WORKSPACE}:/repo" \
            -w /repo/firmware/dengon-relay \
            "${IDF_IMAGE}" \
            idf.py build

      # --- 2. Tests Unity du cœur du transport (US-220) ---------------------
      # components/dengon_transport_core est du C pur, sans NimBLE : il compile
      # pour la cible `linux` d'ESP-IDF, et le binaire de test tourne sur le
      # runner. C'est le portage C des 12 cas de la suite de conformité
      # `Transport` (crates/dengon-ble/src/conformance.rs) + les cas propres au
      # C. Le binaire sort en échec au premier cas rouge.
      # `--preview` : la cible linux est encore marquée « preview » en v5.5.
      # Le même projet se flashe sur carte (set-target esp32) : c'est le volet
      # « tests Unity sur cible » de l'US, exécuté à la main.
      - name: Tests Unity du transport (cible linux)
        if: steps.filtre.outputs.firmware == 'true'
        run: |
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${GITHUB_WORKSPACE}:/repo" \
            -w /repo/firmware/dengon-relay/components/dengon_transport_core/test_apps \
            "${IDF_IMAGE}" \
            sh -ec 'idf.py --preview set-target linux && idf.py build && ./build/test_dengon_transport_core.elf'

      # La même application, compilée pour la carte : on garantit ainsi qu'elle
      # reste flashable. Dossier et sdkconfig séparés (build-esp32/), sinon les
      # deux cibles s'écraseraient mutuellement.
      - name: Compiler les tests Unity pour la carte (cible esp32)
        if: steps.filtre.outputs.firmware == 'true'
        run: |
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${GITHUB_WORKSPACE}:/repo" \
            -w /repo/firmware/dengon-relay/components/dengon_transport_core/test_apps \
            "${IDF_IMAGE}" \
            idf.py -B build-esp32 -D SDKCONFIG=build-esp32/sdkconfig set-target esp32 build

      # --- 2 bis. Tests Unity du Store du relais (US-308) --------------------
      # components/dengon_store : le journal sur fichier (dengon_ledger_file.c,
      # reprise après écriture interrompue, rotation) est du C pur testé sur
      # `linux` ; la moitié NVS + littlefs n'existe que sur carte, ses cas
      # (test_store_cible.c) sont compilés ici et exécutés à la main sur une
      # carte de test (voir docs/suivi/modules/firmware-relay.md).
      - name: Tests Unity du Store (cible linux)
        if: steps.filtre.outputs.firmware == 'true'
        run: |
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${GITHUB_WORKSPACE}:/repo" \
            -w /repo/firmware/dengon-relay/components/dengon_store/test_apps \
            "${IDF_IMAGE}" \
            sh -ec 'idf.py --preview set-target linux && idf.py build && ./build/test_dengon_store.elf'

      - name: Compiler les tests Unity du Store pour la carte (cible esp32)
        if: steps.filtre.outputs.firmware == 'true'
        run: |
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${GITHUB_WORKSPACE}:/repo" \
            -w /repo/firmware/dengon-relay/components/dengon_store/test_apps \
            "${IDF_IMAGE}" \
            idf.py -B build-esp32 -D SDKCONFIG=build-esp32/sdkconfig set-target esp32 build

      # --- 2 ter. Tests Unity de l'export vers le dashboard (US-309) --------
      # components/dengon_ship_core : buffer ring borné (mémoire jamais
      # dépassée, FIFO, écrasement compté, scénario « hors ligne puis retour
      # du réseau ») et politique de réessai selon le statut HTTP. C pur.
      - name: Tests Unity de l'export (cible linux)
        if: steps.filtre.outputs.firmware == 'true'
        run: |
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${GITHUB_WORKSPACE}:/repo" \
            -w /repo/firmware/dengon-relay/components/dengon_ship_core/test_apps \
            "${IDF_IMAGE}" \
            sh -ec 'idf.py --preview set-target linux && idf.py build && ./build/test_dengon_ship_core.elf'

      - name: Compiler les tests Unity de l'export pour la carte (cible esp32)
        if: steps.filtre.outputs.firmware == 'true'
        run: |
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${GITHUB_WORKSPACE}:/repo" \
            -w /repo/firmware/dengon-relay/components/dengon_ship_core/test_apps \
            "${IDF_IMAGE}" \
            idf.py -B build-esp32 -D SDKCONFIG=build-esp32/sdkconfig set-target esp32 build

      # --- 3. Empreinte mémoire ---------------------------------------------
      # Pas de seuil bloquant : sur un squelette le chiffre n'a pas de sens. Il
      # sert de point de départ au budget mémoire de
      # docs/synthese/08-relais-esp32.md §5 (520 Ko de SRAM, sans PSRAM), que
      # l'US-308 devra tenir. La courbe sera visible avant le mur.
      - name: Empreinte flash et RAM dans le résumé du job
        if: steps.filtre.outputs.firmware == 'true'
        run: |
          {
            echo '### Empreinte (idf.py size)'
            echo
            echo '```'
            docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
              -v "${GITHUB_WORKSPACE}:/repo" -w /repo/firmware/dengon-relay \
              "${IDF_IMAGE}" idf.py size
            echo '```'
            echo
            echo "_Budget cible : docs/synthese/08-relais-esp32.md §5. Pas encore bloquant._"
          } >> "$GITHUB_STEP_SUMMARY"

      # L'artefact n'est pas décoratif : il permet de flasher une carte depuis
      # Windows sans rejouer le build, ce qui est le plan de repli quand usbipd
      # ne remonte pas le port série dans WSL2.
      - name: Publier les binaires
        if: steps.filtre.outputs.firmware == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dengon-relay-bin
          path: |
            firmware/dengon-relay/build/dengon-relay.bin
            firmware/dengon-relay/build/dengon-relay.elf
            firmware/dengon-relay/build/bootloader/bootloader.bin
            firmware/dengon-relay/build/partition_table/partition-table.bin
            firmware/dengon-relay/build/flash_args
          retention-days: 14
          if-no-files-found: error
