# ---------------------------------------------------------------------------
# Workflow `deploy-vps` — déploiement manuel du dashboard sur le VPS (US-224).
# Référence : docs/suivi/modules/deploiement-vps.md.
#
# Déclenchement `workflow_dispatch` UNIQUEMENT (pas de `push`) : le VPS est
# PARTAGÉ avec d'autres groupes (voir docs/suivi/03-ecarts-conception.md) —
# un déploiement automatique à chaque merge sur `main` prendrait la décision
# de redémarrer le service pour tout le monde sans qu'un humain ne l'ait
# décidé ce jour-là.
#
# `environment: vps-prod` — les secrets (VPS_HOST/VPS_PORT/VPS_USER/
# VPS_SSH_KEY) vivent dans cet environment GitHub, pas dans les secrets du
# dépôt : un environment peut exiger une approbation manuelle avant de
# s'exécuter (Settings → Environments → vps-prod → Required reviewers),
# recommandé ici puisque c'est un déploiement réel sur un serveur partagé.
#
# Pas de `rsync` : absent du VPS (image de base sans lui, pas d'accès sudo
# pour l'installer — voir docs/suivi/03-ecarts-conception.md). `tar` sur
# ssh fait le même travail sans dépendance supplémentaire côté serveur.
#
# Le `.env` du VPS (secret JWT, adresse Caddy) n'est PAS touché par ce
# workflow : il est créé une fois à la main (voir docs/suivi/modules/
# deploiement-vps.md §Procédure d'accès) et persiste entre les déploiements
# — le régénérer à chaque run invaliderait tous les jetons JWT déjà émis
# aux nœuds.

name: deploy-vps

on:
  workflow_dispatch:

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment: vps-prod
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Préparer la clé SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # `accept-new` plutôt que `StrictHostKeyChecking=no` : accepte une
          # clé d'hôte encore inconnue (premier contact, cas normal ici — le
          # runner est éphémère, aucun `known_hosts` ne survit d'un run à
          # l'autre) mais rejette un CHANGEMENT de clé (signe usurpation/MITM
          # sur les runs suivants si jamais `known_hosts` était mis en cache).
          {
            echo "Host vps-deploy"
            echo "  HostName ${{ secrets.VPS_HOST }}"
            echo "  Port ${{ secrets.VPS_PORT }}"
            echo "  User ${{ secrets.VPS_USER }}"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  StrictHostKeyChecking accept-new"
          } >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Transférer dashboard/api, contracts, dashboard/deploy
        run: |
          tar czf - --exclude='.venv' --exclude='__pycache__' --exclude='*.pyc' \
            dashboard/api contracts dashboard/deploy \
            | ssh vps-deploy "mkdir -p ~/dengon && tar xzf - -C ~/dengon"

      - name: docker compose up -d --build
        run: |
          ssh vps-deploy "cd ~/dengon/dashboard/deploy && docker compose up -d --build"

      - name: Smoke test — /healthz en HTTPS depuis l'extérieur
        run: |
          curl -fsSk "https://${{ secrets.VPS_HOST }}:8443/healthz"

      - name: Smoke test — un batch ingéré de bout en bout
        run: |
          code=$(curl -sk -o /tmp/ingest.json -w '%{http_code}' \
            -X POST "https://${{ secrets.VPS_HOST }}:8443/ingest/batch" \
            -H 'Content-Type: application/json' -d '[]')
          cat /tmp/ingest.json
          test "$code" = "202"
