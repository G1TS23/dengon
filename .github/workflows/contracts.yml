name: contracts

on:
  pull_request:
  push:
    branches: [main]

jobs:
  events:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nécessaire au filtre de chemins sur les événements push.
          fetch-depth: 0

      # Filtrage DANS le job, pas via `on.pull_request.paths` : au niveau du
      # déclencheur, une PR qui ne touche pas contracts/** n'a aucun check
      # run créé du tout, et resterait bloquée sur « En attente » si ce check
      # devient requis — même piège que core.yml/dashboard.yml, voir
      # docs/suivi/03-ecarts-conception.md (retour de revue #60, round 3).
      - name: Détecter les changements contracts
        id: filtre
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            events:
              - 'contracts/**'
              - '.github/workflows/contracts.yml'

      - name: Aucun changement contracts
        if: steps.filtre.outputs.events != 'true'
        run: |
          {
            echo '### events — ignoré'
            echo
            echo "Aucun fichier contracts/ modifié : les étapes uv sont sautées."
            echo "Le check est tout de même rapporté, pour ne pas bloquer la PR."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: steps.filtre.outputs.events == 'true'
        with:
          version: "0.9.25"
          enable-cache: true
      - name: Installer depuis le lock
        if: steps.filtre.outputs.events == 'true'
        run: uv sync --frozen --no-build
      - name: Lint (ruff)
        if: steps.filtre.outputs.events == 'true'
        run: uv run --no-sync --no-build ruff check .
      - name: Fixtures régénérées à l'identique
        if: steps.filtre.outputs.events == 'true'
        run: |
          uv run --no-sync --no-build python tools/build_fixtures.py
          git diff --exit-code -- events/
      - name: Valider fixtures + schémas + signatures + redaction
        if: steps.filtre.outputs.events == 'true'
        run: uv run --no-sync --no-build python tools/validate.py
