[package]
name        = "dengon-core"
description = "Cœur du protocole dengon : format de paquet, crypto, routage, journal chaîné"

version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
repository.workspace   = true
authors.workspace      = true
publish.workspace      = true

[features]
# `std` par défaut sur les cibles hôte (Android, PC, dashboard).
# `--no-default-features` = le mode `no_std` + `alloc` visé pour l'ESP32
# (docs/synthese/04-architecture.md §2, « Frontières no_std »).
default = ["std"]
std     = []

[dependencies]

[dev-dependencies]
# Lecture des vecteurs de conformité (tests/vectors_v0.json) — via `Value`,
# pas de derive, donc `serde` n'est pas tiré comme dépendance de proc-macro.
serde_json = "1"

[lints]
workspace = true
