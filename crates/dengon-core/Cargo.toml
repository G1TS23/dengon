[package]
name        = "dengon-core"
description = "Cœur du protocole dengon : format de paquet, crypto, routage, journal chaîné"

version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
repository.workspace   = true
authors.workspace      = true
publish.workspace      = true

[features]
# `std` par défaut sur les cibles hôte (Android, PC, dashboard).
# `--no-default-features` = le mode `no_std` + `alloc` visé pour l'ESP32
# (docs/synthese/04-architecture.md §2, « Frontières no_std »).
#
# `store` (US-207) est de la partie : contrairement à `protocol`/`sync`/
# `ledger`, ce module n'a PAS vocation à compiler en no_std — rusqlite
# vendorise sqlite3 en C, ça n'existe pas sur ESP32 (docs/synthese/04 §2 :
# "store est derrière un trait Store", l'impl ESP32 sera un module séparé,
# NVS/flash, pas celui-ci). La feature `std` active donc `store` : elle tire
# `rusqlite` et ajoute `getrandom` à `chacha20poly1305` (pour `aead::OsRng`).
# `chacha20poly1305` lui-même n'est plus optionnel : le coffre d'`identity`
# (US-205) s'en sert aussi en no_std, avec la RNG de l'appelant.
default = ["std"]
std     = ["dep:rusqlite", "chacha20poly1305/getrandom"]

[dependencies]
sha2 = { workspace = true }
rusqlite = { workspace = true, optional = true }
ed25519-dalek = { workspace = true }
snow          = { workspace = true }
curve25519-dalek = { workspace = true }
hmac          = { workspace = true }
rand_core     = { workspace = true }
zeroize       = { workspace = true }
chacha20poly1305 = { workspace = true }
data-encoding    = { workspace = true }

[dev-dependencies]
rand_chacha = { workspace = true }
# Property tests (ledger, store, crypto, le codec US-201 :
# decode(encode(p)) == p, aucun panic sur des octets arbitraires, et
# sync::status US-211 : monotonie des statuts, format d'outbox).
proptest    = { workspace = true }
# Tests de bout en bout de `sync::routing` contre `MockTransport` (US-209,
# tests/routing_mock.rs). Cycle de dépendances *de dev* uniquement
# (dengon-ble dépend de dengon-core) : Cargo l'autorise, et les tests
# d'intégration lient la même instance de dengon-core que dengon-ble.
dengon-ble  = { workspace = true }
# Lecture des vecteurs de conformité (contracts/packet/vectors_v0.json,
# contracts/packet/crypto_v0.json) — via `Value`, pas de derive, donc `serde`
# n'est pas tiré comme dépendance de proc-macro.
serde_json  = { workspace = true }

[lints]
workspace = true
