# Configuration cbindgen pour `include/dengon_core.h` (US-307).
#
# Surface exportée : décodage L3 (US-307), relais et auto-test Noise
# (US-308, `src/relay.rs` / `src/rng.rs`). Étoffer au fil des besoins réels
# du firmware, pas par anticipation.

language = "C"
header = """
/* Généré par cbindgen (build.rs de dengon-core-ffi) — NE PAS ÉDITER À LA MAIN.
 * Régénérer : `cargo build -p dengon-core-ffi`, puis committer le résultat.
 */"""
include_guard = "DENGON_CORE_H"
braces = "SameLine"
line_length = 88
tab_width = 4
documentation = true
documentation_style = "doxy"

[export]
prefix = "Dengon"

[enum]
# Variantes préfixées (`DENGON_STATUS_OK`) : un `OK` nu entre en collision
# avec l'énumérateur `OK` de `rom/ets_sys.h` d'ESP-IDF, inclus par la plupart
# des en-têtes système du firmware (trouvé au premier lien firmware, US-308).
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"
