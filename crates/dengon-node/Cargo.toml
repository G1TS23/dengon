[package]
name        = "dengon-node"
description = "Nœud dengon headless en ligne de commande"

version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
repository.workspace   = true
authors.workspace      = true
publish.workspace      = true

[features]
# `ble` (défaut) : le vrai transport `btleplug`. Sans lui, `run` refuse de
# démarrer mais le reste (session, identité) compile et se teste — utile sur une
# machine sans libdbus.
default = ["ble"]
ble     = ["dengon-ble/btleplug"]

[dependencies]
dengon-core = { workspace = true }
dengon-ble  = { workspace = true }
clap        = { workspace = true }
# `getrandom` : `OsRng`, la source d'aléa du nœud (le cœur, lui, reçoit sa RNG
# de l'appelant — il n'en tire jamais lui-même).
rand_core   = { workspace = true, features = ["getrandom"] }

[lints]
workspace = true
