# Configuration des bindings UniFFI générés (US-302).
#
# Paquet Kotlin identique à celui du bouchon écrit à la main
# (android/app/src/main/java/com/dengon/app/ffi/) : les bindings générés
# remplaceront DengonTypes.kt / DengonNodeStub.kt sans changer les imports de
# l'UI (revue PR #69, Paul).
[bindings.kotlin]
package_name = "com.dengon.app.ffi"
# Nom de la bibliothèque chargée par JNA : libdengon_ffi.so (nom de la crate).
# Sans cette ligne, uniffi-bindgen, lancé sur le `.udl` hors métadonnées Cargo,
# chercherait « uniffi_dengon ».
cdylib_name  = "dengon_ffi"
