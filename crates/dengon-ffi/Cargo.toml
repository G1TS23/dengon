[package]
name        = "dengon-ffi"
description = "Bindings UniFFI de dengon-core (Kotlin ; Swift en v2)"

version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
repository.workspace   = true
authors.workspace      = true
publish.workspace      = true

[lib]
# "lib" (rlib) est INDISPENSABLE : sans lui, `cargo test` ne peut pas compiler
# les tests unitaires de la crate. "cdylib" produit le libdengon_ffi.so chargé
# par l'application Android. "staticlib" sera ajouté le jour où le firmware
# ESP32 aura besoin d'une libdengon_core.a (docs/synthese/08-relais-esp32.md).
crate-type = ["lib", "cdylib"]

[[bin]]
# Générateur des bindings Kotlin (US-302), lancé par
# android/scripts/build-ffi.sh. Derrière la feature `bindgen` : sans elle,
# `uniffi/cli` (et clap avec lui) n'entre dans aucun build normal ni dans le
# `.so` Android.
name              = "uniffi-bindgen"
path              = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
dengon-core = { workspace = true }
uniffi = { workspace = true }
# `getrandom` : `OsRng`, l'aléa que la façade `api` attend de l'appelant
# (handshake Noise, msg_uuid, génération d'identité). Activé ici seulement :
# dengon-ffi ne vise que des cibles `std` (Android, hôte de test), le cœur
# `no_std` reste sans getrandom.
rand_core = { workspace = true, features = ["getrandom"] }
# peer_id en base32, conv_id / msg_uuid en hexadécimal (src/convert.rs).
data-encoding = { workspace = true }

[build-dependencies]
# Feature "build" : seule celle-ci ajoute `uniffi::generate_scaffolding`,
# utilisée par build.rs. La génération Kotlin passe par le binaire
# `uniffi-bindgen` ci-dessus (feature `bindgen`).
uniffi = { workspace = true, features = ["build"] }

[lints]
workspace = true
