[package]
name        = "dengon-sim"
description = "Simulateur multi-nœuds dengon (transport en mémoire, scénarios .ron)"

version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
repository.workspace   = true
authors.workspace      = true
publish.workspace      = true

[dependencies]
dengon-core = { workspace = true }
# Le contrat `Transport` (US-105) que `SimTransport` implémente.
dengon-ble  = { workspace = true }
# Lecture des scénarios `scenarios/*.ron` (docs/synthese/10 §4.3).
serde = { version = "1", features = ["derive"] }
ron   = "0.12"

[lints]
workspace = true
